# GitHub Actions self-hosted runner.
# Image: https://github.com/myoung34/github-runner (pinned to 2.336.0-ubuntu-jammy)
# Docs:  https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners-with-github-actions
#
# Registration: set RUNNER_TOKEN (short-lived, from repo Settings > Actions > Runners)
# OR ACCESS_TOKEN (fine-grained PAT with "Administration: Read & write" on the repo)
# for restart-resilient auto-registration. Put real values in .env (gitignored).

x-service-policy: &service-policy
  restart: unless-stopped

services:
  runner-dind:
    <<: *service-policy
    image: docker:dind
    privileged: "true"
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]

  github-runner:
    <<: *service-policy
    image: "myoung34/github-runner:2.336.0-ubuntu-jammy"
    links:
      - runner-dind
    depends_on:
      runner-dind:
        condition: service_started
    environment:
      REPO_URL: https://github.com/davwales/ouranos-infrastructure
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      ACCESS_TOKEN: ${ACCESS_TOKEN}
      RUNNER_NAME: ouranos-runner
      LABELS: self-hosted,linux,docker
      DOCKER_HOST: tcp://runner-dind:2375
    volumes:
      - runner_data:/actions-runner

volumes:
  runner_data:
