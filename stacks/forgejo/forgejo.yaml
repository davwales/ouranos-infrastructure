# See https://forgejo.org/docs/next/admin/actions/runner-installation for setup instructions.

services:
  forgejo-dind:
    image: docker:dind
    privileged: "true"
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
    restart: "unless-stopped"

  forgejo-runner:
    image: "data.forgejo.org/forgejo/runner:11"
    links:
      - forgejo-dind
    depends_on:
      forgejo-dind:
        condition: service_started
    environment:
      DOCKER_HOST: tcp://forgejo-dind:2375
    user: 1000:1000
    volumes:
      - forgejo_data:/data
    restart: "unless-stopped"

    command: '/bin/sh -c "sleep 5; forgejo-runner daemon --config config.yml"'

volumes:
  forgejo_data:
