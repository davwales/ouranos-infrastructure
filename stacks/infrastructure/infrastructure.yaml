include:
  - grafana/grafana.yaml
  - postgres/postgres.yaml

services:
  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    hostname: pantheon-messaging
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    command: >
      sh -c "rabbitmq-plugins enable rabbitmq_shovel rabbitmq_shovel_management &&
             rabbitmq-server"
    restart: always

  valkey:
    image: valkey/valkey:9.0.3
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: ["valkey-server", "--save", "60", "1", "--loglevel", "warning"]
    restart: always

  flagsmith:
    image: flagsmith/flagsmith:2.284.0
    restart: always
    environment:
      DJANGO_ALLOWED_HOSTS: "*"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/flagsmith
      ENV: prod
    ports:
      - 8001:8000
    depends_on:
      postgres:
        condition: service_healthy

  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:1.23.0
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Only update containers labeled com.centurylinklabs.watchtower.enable=true
      # (the pantheon services). Everything else is pinned and bumped by Renovate.
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: 300
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_ROLLING_RESTART: "true"

volumes:
  valkey_data:
  rabbitmq_data:
  rabbitmq_logs:
