stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    # 336h = 14 days. Tempo uses Go duration format, which has no 'd' unit,
    # so days must be written as hours here.
    block_retention: 336h

usage_report:
  reporting_enabled: false