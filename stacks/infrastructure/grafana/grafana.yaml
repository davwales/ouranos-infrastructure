services:
  loki:
    image: grafana/loki:3.1.0
    command: "-config.file=/etc/loki/config.yaml -target=all"
    user: root
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
      - ./.data/loki:/loki
    networks:
      default:
        aliases: [loki-gateway]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  alloy:
    image: grafana/alloy:v1.20.1
    restart: always
    volumes:
      - ./alloy-local-config.yaml:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - 12345:12345
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - loki
      - tempo
      - mimir

  tempo:
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo.yaml"]
    user: root
    restart: always
    volumes:
      - ./tempo-config.yaml:/etc/tempo.yaml
      - ./.data/tempo:/var/tempo
    ports:
      - "3200:3200"
      - "4317"
      - "4318"

  mimir:
    image: grafana/mimir:3.2.0
    command: ["--config.file=/etc/mimir/mimir.yaml"]
    restart: always
    volumes:
      - ./mimir-config.yaml:/etc/mimir/mimir.yaml
      - ./.data/mimir:/data
    ports:
      - "9009:9009"

  grafana:
    image: grafana/grafana:13.1.4
    restart: always
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - loki
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  grafana_data:
