x-service-policy: &service-policy
  restart: always

services:
  pantheon-gateway:
    <<: *service-policy
    image: codeberg.org/ouranos-labs/pantheon-gateway:latest
    ports:
      - "8300:8300"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8300
      Ouranos__IncludeExceptionDetails: true
      Ouranos__RequestTimeout: 180
      Ouranos__Postgres__Host: postgres
      Ouranos__Postgres__Username: ${POSTGRES_USER}
      Ouranos__Postgres__Password: ${POSTGRES_PASSWORD}
      Ouranos__RabbitMq__Host: rabbitmq
      Ouranos__RabbitMq__Username: ${RABBITMQ_USERNAME}
      Ouranos__RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Ouranos__OuranosMl__ConnectionString: ${OURANOS_ML_URL}
      Ouranos__Plutus__DataLoaders__Osrs__Wiki__UserAgent: ${OSRS_WIKI_USER_AGENT}
      Ouranos__Plutus__DataLoaders__Stocks__ApiKey: ${ALPACA_API_KEY}
      Ouranos__Plutus__DataLoaders__Stocks__ApiSecret: ${ALPACA_API_SECRET}

  pantheon-interface:
    <<: *service-policy
    image: codeberg.org/ouranos-labs/pantheon-interface:latest
    ports:
      - "80:3000"
