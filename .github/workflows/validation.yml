name: Validation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Populate .env files from samples
        run: |
          for f in sample.env stacks/infrastructure/sample.env stacks/pantheon/sample.env; do
            cp "$f" "$(dirname "$f")/.env"
          done
      - run: docker compose config --quiet
